# Docker DNS resolver
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

# Define upstream servers with DNS resolution
upstream backend_server {
    server backend:8000;
}

upstream frontend_server {
    server frontend:3000;
}

# Перенаправление www → без www (HTTP и HTTPS)
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.kontrast-shop.ru;

    ssl_certificate /etc/letsencrypt/live/kontrast-shop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kontrast-shop.ru/privkey.pem;

    return 301 https://kontrast-shop.ru$request_uri;
}

# Перенаправление HTTP → HTTPS
server {
    listen 80;
    server_name kontrast-shop.ru;

    return 301 https://$host$request_uri;
}

# Основной сервер (HTTPS)
server {
    listen 443 ssl http2;
    server_name kontrast-shop.ru;

    ssl_certificate /etc/letsencrypt/live/kontrast-shop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kontrast-shop.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    location /staticfiles/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /swagger {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /schema {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /admin {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /api {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}